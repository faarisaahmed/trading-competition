# Runs the competition on GitHub's machines, so nothing has to stay awake.
#
# A session is 13:30-20:00 UTC (09:30-16:00 ET), which is longer than the
# six hours a single job may run. So the day is split in two and the baton is
# passed on disk: the engine checkpoints every tick, and `state pull/push`
# carries the ledger between jobs on a branch. The second job resumes the
# round exactly where the first left it -- it is never flattened or scored
# early.
#
# Times are fixed UTC. The season (21 Sep - 9 Oct 2026) sits entirely inside
# US daylight time, so no offset changes mid-competition.

name: Season

on:
  schedule:
    # Morning: starts 25 min before the bell, hands over at 16:40 UTC.
    - cron: "5 13 * * 1-5"
    # Afternoon: through to just past the close.
    - cron: "45 16 * * 1-5"
    # Weekend heartbeat: refresh the public countdown once a day.
    - cron: "0 15 * * 6,0"
  workflow_dispatch:
    inputs:
      until:
        description: "UTC HH:MM to stop at"
        required: false
        default: "20:10"

# Only ever one of these at a time. Two processes trading the same three
# accounts would be a catastrophe, not a race condition.
concurrency:
  group: season
  cancel-in-progress: true

jobs:
  trade:
    runs-on: ubuntu-latest
    # A hard ceiling under GitHub's 6h limit; the app stops itself before this.
    timeout-minutes: 350
    permissions:
      contents: write        # push the dashboard and the ledger

    env:
      ALPACA_GROUP_A_KEY_ID: ${{ secrets.ALPACA_GROUP_A_KEY_ID }}
      ALPACA_GROUP_A_SECRET_KEY: ${{ secrets.ALPACA_GROUP_A_SECRET_KEY }}
      ALPACA_GROUP_B_KEY_ID: ${{ secrets.ALPACA_GROUP_B_KEY_ID }}
      ALPACA_GROUP_B_SECRET_KEY: ${{ secrets.ALPACA_GROUP_B_SECRET_KEY }}
      ALPACA_GROUP_C_KEY_ID: ${{ secrets.ALPACA_GROUP_C_KEY_ID }}
      ALPACA_GROUP_C_SECRET_KEY: ${{ secrets.ALPACA_GROUP_C_SECRET_KEY }}
      ALPACA_DATA_KEY_ID: ${{ secrets.ALPACA_DATA_KEY_ID }}
      ALPACA_DATA_SECRET_KEY: ${{ secrets.ALPACA_DATA_SECRET_KEY }}
      ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # `state pull` needs to reach other branches

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Identify for pushes
        run: |
          git config user.name  "competition-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Restore the ledger
        run: comp state pull

      - name: Pre-flight
        run: comp doctor --check-accounts

      - name: Decide when to stop
        id: window
        run: |
          case "${{ github.event.schedule }}" in
            "5 13 * * 1-5")  echo "until=16:40" >> "$GITHUB_OUTPUT" ;;
            "45 16 * * 1-5") echo "until=20:10" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 6,0")  echo "until=15:10" >> "$GITHUB_OUTPUT" ;;
            *)               echo "until=${{ inputs.until || '20:10' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run the season
        run: comp season --until "${{ steps.window.outputs.until }}"

      # Even on failure: whatever was learned and traded must not be lost.
      - name: Save the ledger
        if: always()
        run: comp state push

      - name: Publish the dashboard
        if: always()
        run: comp publish || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-logs-${{ github.run_id }}
          path: runs/*.log
          if-no-files-found: ignore
          retention-days: 14
