# Runs the competition on GitHub's machines, so nothing has to stay awake.
#
# One job may run for at most six hours, so the season is a CHAIN of jobs:
# each runs for a fixed budget (`--until auto`), saves the ledger, and starts
# its own successor with `gh workflow run`. The baton is passed on disk: the
# engine checkpoints every tick, and `state pull/push` carries the ledger
# between jobs on a branch. The next job resumes the round exactly where the
# last left it -- it is never flattened or scored early.
#
# Why a chain and not cron: in practice GitHub fired the cron below only two
# or three times a day, the first rarely before 17:00 UTC, so every session
# of Round 1 and the first Round 2 lost its first three to four hours. Cron
# stays as a backstop that restarts a broken chain.

name: Season

on:
  schedule:
    # GitHub's scheduled runs are best-effort: they can be delayed by hours
    # or dropped entirely. A single trigger per window is therefore not a
    # schedule, it is a hope. Instead: fire every 20 minutes through the
    # session, and let the concurrency lock keep exactly one alive. A dropped
    # trigger then costs 20 minutes, not a day.
    - cron: "*/20 13-20 * * 1-5"
    # A couple before the bell, so an average delay still catches the open.
    - cron: "5,25,45 12 * * 1-5"
    # Weekend heartbeat: refresh the public countdown.
    - cron: "0 15 * * 6,0"
  workflow_dispatch:
    inputs:
      until:
        description: "UTC HH:MM to stop at, or 'auto' for the standard budget"
        required: false
        default: "auto"

# Exactly one at a time: two processes trading the same three accounts would
# be a catastrophe, not a race condition.
#
# NOT cancel-in-progress. Cancelling would kill a healthy job mid-round every
# 20 minutes. Queuing instead makes the frequent triggers self-healing: while
# one run works, the next waits, and it takes over the moment the first hits
# its deadline. GitHub keeps at most one pending run per group, so they cannot
# pile up.
concurrency:
  group: season
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # A hard ceiling under GitHub's 6h limit; the app stops itself well
    # before this (cli.JOB_BUDGET), leaving time to save the ledger.
    timeout-minutes: 345
    permissions:
      contents: write        # push the dashboard and the ledger
      actions: write         # start the next job in the chain

    env:
      ALPACA_GROUP_A_KEY_ID: ${{ secrets.ALPACA_GROUP_A_KEY_ID }}
      ALPACA_GROUP_A_SECRET_KEY: ${{ secrets.ALPACA_GROUP_A_SECRET_KEY }}
      ALPACA_GROUP_B_KEY_ID: ${{ secrets.ALPACA_GROUP_B_KEY_ID }}
      ALPACA_GROUP_B_SECRET_KEY: ${{ secrets.ALPACA_GROUP_B_SECRET_KEY }}
      ALPACA_GROUP_C_KEY_ID: ${{ secrets.ALPACA_GROUP_C_KEY_ID }}
      ALPACA_GROUP_C_SECRET_KEY: ${{ secrets.ALPACA_GROUP_C_SECRET_KEY }}
      ALPACA_DATA_KEY_ID: ${{ secrets.ALPACA_DATA_KEY_ID }}
      ALPACA_DATA_SECRET_KEY: ${{ secrets.ALPACA_DATA_SECRET_KEY }}
      ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # `state pull` needs to reach other branches

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Identify for pushes
        run: |
          git config user.name  "competition-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Restore the ledger
        run: comp state pull

      - name: Pre-flight
        run: comp doctor --check-accounts

      # The window comes from the clock, not from which trigger fired: a run
      # that GitHub delayed by two hours must still stop at the right time.
      - name: Run the season
        run: comp season --until "${{ inputs.until || 'auto' }}"

      # Even on failure: whatever was learned and traded must not be lost.
      - name: Save the ledger
        if: always()
        run: comp state push

      - name: Publish the dashboard
        if: always()
        run: comp publish || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-logs-${{ github.run_id }}
          path: runs/*.log
          if-no-files-found: ignore
          retention-days: 14

      # Start the next link. It queues behind this job (same concurrency
      # group) and begins the moment this one ends. A failed job still hands
      # over -- a transient Alpaca error mid-session must not cost the rest
      # of the day -- but after a pause, so a persistent fault retries every
      # few minutes instead of spinning.
      - name: Hand over to the next job
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if comp season --dry-run --no-publish | grep -q "phase now: done"; then
            echo "Season finished; ending the chain."
            exit 0
          fi
          if [ "${{ job.status }}" != "success" ]; then sleep 300; fi
          gh workflow run season.yml --ref "${{ github.ref_name }}"
