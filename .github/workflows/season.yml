# Runs the competition on GitHub's machines, so nothing has to stay awake.
#
# A session is 13:30-20:00 UTC (09:30-16:00 ET), which is longer than the
# six hours a single job may run. So the day is split in two and the baton is
# passed on disk: the engine checkpoints every tick, and `state pull/push`
# carries the ledger between jobs on a branch. The second job resumes the
# round exactly where the first left it -- it is never flattened or scored
# early.
#
# Times are fixed UTC. The season (21 Sep - 9 Oct 2026) sits entirely inside
# US daylight time, so no offset changes mid-competition.

name: Season

on:
  schedule:
    # GitHub's scheduled runs are best-effort: they can be delayed by hours
    # or dropped entirely. A single trigger per window is therefore not a
    # schedule, it is a hope. Instead: fire every 20 minutes through the
    # session, and let the concurrency lock keep exactly one alive. A dropped
    # trigger then costs 20 minutes, not a day.
    - cron: "*/20 13-20 * * 1-5"
    # A couple before the bell, so an average delay still catches the open.
    - cron: "5,25,45 12 * * 1-5"
    # Weekend heartbeat: refresh the public countdown.
    - cron: "0 15 * * 6,0"
  workflow_dispatch:
    inputs:
      until:
        description: "UTC HH:MM to stop at"
        required: false
        default: "20:10"

# Exactly one at a time: two processes trading the same three accounts would
# be a catastrophe, not a race condition.
#
# NOT cancel-in-progress. Cancelling would kill a healthy job mid-round every
# 20 minutes. Queuing instead makes the frequent triggers self-healing: while
# one run works, the next waits, and it takes over the moment the first hits
# its deadline. GitHub keeps at most one pending run per group, so they cannot
# pile up.
concurrency:
  group: season
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # A hard ceiling under GitHub's 6h limit; the app stops itself before this.
    timeout-minutes: 240
    permissions:
      contents: write        # push the dashboard and the ledger

    env:
      ALPACA_GROUP_A_KEY_ID: ${{ secrets.ALPACA_GROUP_A_KEY_ID }}
      ALPACA_GROUP_A_SECRET_KEY: ${{ secrets.ALPACA_GROUP_A_SECRET_KEY }}
      ALPACA_GROUP_B_KEY_ID: ${{ secrets.ALPACA_GROUP_B_KEY_ID }}
      ALPACA_GROUP_B_SECRET_KEY: ${{ secrets.ALPACA_GROUP_B_SECRET_KEY }}
      ALPACA_GROUP_C_KEY_ID: ${{ secrets.ALPACA_GROUP_C_KEY_ID }}
      ALPACA_GROUP_C_SECRET_KEY: ${{ secrets.ALPACA_GROUP_C_SECRET_KEY }}
      ALPACA_DATA_KEY_ID: ${{ secrets.ALPACA_DATA_KEY_ID }}
      ALPACA_DATA_SECRET_KEY: ${{ secrets.ALPACA_DATA_SECRET_KEY }}
      ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # `state pull` needs to reach other branches

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Identify for pushes
        run: |
          git config user.name  "competition-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Restore the ledger
        run: comp state pull

      - name: Pre-flight
        run: comp doctor --check-accounts

      # The window comes from the clock, not from which trigger fired: a run
      # that GitHub delayed by two hours must still stop at the right time.
      - name: Run the season
        run: comp season --until "${{ inputs.until || 'auto' }}"

      # Even on failure: whatever was learned and traded must not be lost.
      - name: Save the ledger
        if: always()
        run: comp state push

      - name: Publish the dashboard
        if: always()
        run: comp publish || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-logs-${{ github.run_id }}
          path: runs/*.log
          if-no-files-found: ignore
          retention-days: 14
